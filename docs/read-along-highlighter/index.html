<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReadAlong Highlighter</title>
    <script type="module" crossorigin src="/classroom-tools/read-along-highlighter/assets/index-DeifFc4R.js"></script>
    <link rel="stylesheet" crossorigin href="/classroom-tools/read-along-highlighter/assets/index-B2QlqMPU.css">
  </head>
  <body>
    <main id="text-container" aria-label="Read-along text"></main>

    <aside id="minimap" class="right" aria-label="Document minimap" hidden>
      <div id="minimap-content" aria-hidden="true"></div>
      <div id="minimap-viewport" aria-hidden="true"></div>
    </aside>

    <button id="sidebar-toggle" type="button" aria-expanded="false" aria-controls="sidebar" aria-label="Open settings">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 6h16M7 12h10M10 18h4"></path>
      </svg>
    </button>

    <aside id="sidebar" aria-label="ReadAlong settings" aria-hidden="true">
      <header class="sidebar-header">
        <p class="eyebrow">ReadAlong Highlighter</p>
        <div class="sidebar-actions">
          <a class="icon-button" href="../" aria-label="Classroom Tools home" title="Home">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"></path></svg>
          </a>
          <button id="fullscreen-toggle" class="icon-button" type="button" aria-label="Enter fullscreen" aria-pressed="false" title="Enter fullscreen">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path class="fullscreen-enter" d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"></path>
              <path class="fullscreen-exit" d="M3 8h5V3m8 0v5h5M8 21v-5H3m18 0h-5v5" hidden></path>
            </svg>
          </button>
          <button id="sidebar-close" class="icon-button" type="button" aria-label="Close settings" title="Close settings">&times;</button>
        </div>
      </header>
      <p id="fullscreen-status" class="fullscreen-status" role="status" hidden></p>

      <section class="settings-section typography-controls">
        <label class="field-label" for="text-input">Text</label>
        <textarea id="text-input" placeholder="Paste your text here..." spellcheck="true"></textarea>
        <p id="text-status" class="text-status" role="status" hidden></p>
      </section>

      <section class="settings-section">
        <div class="control-heading">
          <label for="font-size-range">Font size</label>
          <div class="number-unit"><input id="font-size-number" type="number" min="12" max="120" step="1" value="36" /><span>px</span></div>
        </div>
        <input id="font-size-range" class="range-input" type="range" min="12" max="120" step="1" value="36" />

        <div class="control-heading">
          <label for="word-spacing-range">Word spacing</label>
          <output id="word-spacing-value" for="word-spacing-range">0</output>
        </div>
        <input id="word-spacing-range" class="range-input" type="range" min="0" max="2" step="0.25" value="0" list="word-spacing-steps" />
        <datalist id="word-spacing-steps">
          <option value="0"></option><option value="0.5"></option><option value="1"></option><option value="1.5"></option><option value="2"></option>
        </datalist>

        <div class="control-heading">
          <label for="character-spacing-range">Character spacing</label>
          <output id="character-spacing-value" for="character-spacing-range">0</output>
        </div>
        <input id="character-spacing-range" class="range-input" type="range" min="0" max="0.25" step="0.01" value="0" />

        <div class="control-heading">
          <label for="line-spacing-range">Line spacing</label>
          <output id="line-spacing-value" for="line-spacing-range">1.6&times;</output>
        </div>
        <input id="line-spacing-range" class="range-input" type="range" min="1" max="3" step="0.1" value="1.6" />
      </section>

      <section class="settings-section">
        <div class="colour-grid">
          <div class="colour-control">
            <span class="colour-control-label">Text</span>
            <input type="hidden" id="text-color" value="#ffffff" />
            <button class="colour-trigger" type="button" data-colour-for="text-color" data-colour-label="Text colour" aria-haspopup="dialog" aria-controls="colour-popover">
              <span class="colour-trigger-swatch" style="--swatch-colour: #ffffff" aria-hidden="true"></span>
              <output>#FFFFFF</output>
            </button>
          </div>
          <div class="colour-control">
            <span class="colour-control-label">Background</span>
            <input type="hidden" id="background-color" value="#000000" />
            <button class="colour-trigger" type="button" data-colour-for="background-color" data-colour-label="Background colour" aria-haspopup="dialog" aria-controls="colour-popover">
              <span class="colour-trigger-swatch" style="--swatch-colour: #000000" aria-hidden="true"></span>
              <output>#000000</output>
            </button>
          </div>
          <div class="colour-control">
            <span class="colour-control-label">Highlight</span>
            <input type="hidden" id="highlight-bg-color" value="#003366" />
            <button class="colour-trigger" type="button" data-colour-for="highlight-bg-color" data-colour-label="Highlight colour" aria-haspopup="dialog" aria-controls="colour-popover">
              <span class="colour-trigger-swatch" style="--swatch-colour: #003366" aria-hidden="true"></span>
              <output>#003366</output>
            </button>
          </div>
          <div class="colour-control">
            <span class="colour-control-label">Highlighted text</span>
            <input type="hidden" id="highlight-text-color" value="#ffffff" />
            <button class="colour-trigger" type="button" data-colour-for="highlight-text-color" data-colour-label="Highlighted text colour" aria-haspopup="dialog" aria-controls="colour-popover">
              <span class="colour-trigger-swatch" style="--swatch-colour: #ffffff" aria-hidden="true"></span>
              <output>#FFFFFF</output>
            </button>
          </div>
        </div>
      </section>

      <section class="settings-section">
        <label class="switch-row">
          <span><strong>Show leading word</strong><small>Outline the next word in the reading sequence.</small></span>
          <input id="show-leading-word" type="checkbox" checked />
          <span class="switch" aria-hidden="true"><span></span></span>
        </label>
        <label class="switch-row switch-row-separated">
          <span><strong>Show minimap</strong><small>Click or drag it to move through the text.</small></span>
          <input id="minimap-visible" type="checkbox" checked />
          <span class="switch" aria-hidden="true"><span></span></span>
        </label>
        <label class="select-row" for="minimap-side">
          <span>Position</span>
          <select id="minimap-side">
            <option value="left" selected>Left</option>
            <option value="right">Right</option>
          </select>
        </label>
      </section>
    </aside>

    <div id="colour-popover" class="colour-popover" popover="auto" role="dialog" aria-labelledby="colour-popover-title">
      <header class="colour-popover-header">
        <strong id="colour-popover-title">Choose colour</strong>
        <button id="colour-popover-done" class="colour-popover-done" type="button" aria-label="Done choosing colour" title="Done">&#10003;</button>
      </header>
      <div id="colour-field" class="colour-field" aria-hidden="true">
        <span id="colour-field-cursor" aria-hidden="true"></span>
      </div>
      <label class="colour-popover-control" for="colour-hue">
        <span>Hue</span>
        <input id="colour-hue" class="colour-hue" type="range" min="0" max="359" step="1" value="0" />
      </label>
      <label class="colour-popover-control" for="colour-saturation">
        <span>Saturation</span>
        <input id="colour-saturation" class="colour-channel" type="range" min="0" max="100" step="1" value="100" />
      </label>
      <label class="colour-popover-control" for="colour-brightness">
        <span>Brightness</span>
        <input id="colour-brightness" class="colour-channel" type="range" min="0" max="100" step="1" value="100" />
      </label>
      <label class="colour-popover-control colour-hex-control" for="colour-hex">
        <span>Hex</span>
        <input id="colour-hex" type="text" value="#FFFFFF" inputmode="text" maxlength="7" spellcheck="false" autocomplete="off" />
      </label>
    </div>

  </body>
</html>
