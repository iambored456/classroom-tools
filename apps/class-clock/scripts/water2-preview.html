<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Water Bars 2 · animation checks</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 28px; font: 15px system-ui, sans-serif; color: #eaf1f7; background: #080b0f; }
    main { max-width: 1100px; margin: auto; }
    h1 { font-weight: 500; font-size: 28px; margin: 0 0 8px; }
    p { color: #a9b6c4; margin: 0 0 28px; }
    .controls { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin: 26px 0; }
    input { accent-color: #54cce2; }
    button, select { padding: 10px 14px; color: inherit; background: #18212d; border: 1px solid #364455; border-radius: 8px; }
    label { display: flex; gap: 10px; align-items: center; }
    #water-fill-container { position: relative; display: flex; gap: 10px; width: 100%; height: 330px; padding: 2px; }
    .water-fill-outline-segment { flex: 1; min-width: 0; border: 2px solid #eaf1f7; border-radius: 15px; background: transparent; }
    canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
    .water2-fallback-canvas { display: block; }
    output { color: #a9b6c4; line-height: 1.8; font-variant-numeric: tabular-nums; }
    body.light { background: #f0f0f0; color: #17202a; }
    body.light .water-fill-outline-segment { border-color: #17202a; }
    body.light button { color: #eaf1f7; }
    body.light p, body.light output { color: #536170; }
    @media (max-width: 500px) { body { padding: 28px 14px; } #water-fill-container { height: 220px; gap: 8px; } }
  </style>
</head>
<body>
<main>
  <h1>Water Bars 2</h1>
  <p>Development preview · forming drops, tinted water, surface tension and reflected light.</p>
  <div id="water-fill-container" class="water2-mode">
    <div class="water-fill-outline-segment"></div><div class="water-fill-outline-segment"></div>
    <div class="water-fill-outline-segment"></div><div class="water-fill-outline-segment"></div>
    <div class="water-fill-outline-segment"></div><canvas id="water-fill-2-canvas"></canvas>
  </div>
  <div class="controls">
    <label>Period progress <input id="progress" type="range" min="0" max="100" step="0.1" value="48"></label>
    <label>Drop size <input id="detail" type="range" min="2" max="10" value="6"></label>
    <button id="palette">All five colours</button><button id="drain">Drain and refill</button>
    <button id="theme">Light background</button><button id="pause">Pause</button>
    <button id="context">Lose GPU context</button><button id="restore">Restore GPU context</button>
  </div>
  <output id="diagnostics" aria-live="off"></output>
</main>
<script type="module" src="./water2-preview.ts"></script>
</body>
</html>
